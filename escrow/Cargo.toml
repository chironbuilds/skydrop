[workspace]
[package]
name = "bsky-escrow"
version = "0.1.0"
edition = "2024"

[dependencies]
tari_template_lib = { path = "../../../../template_lib" }
sha2 = { version = "0.10", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lib]
crate-type = ["cdylib"]
