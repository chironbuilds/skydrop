[workspace]

[package]
name = "atp-verify"
version = "0.1.0"
edition = "2024"

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
serde_json = "1"
hex = "0.4"
