[workspace]
[package]
name = "bsky-service-pay"
version = "0.1.0"
edition = "2024"

[dependencies]
tari_template_lib = { path = "../../../../template_lib" }
atp-verify = { path = "../../../../../atp-verify" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lib]
crate-type = ["cdylib"]
